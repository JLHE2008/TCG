name: Refresh Atlas market data
on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh.yml'
      - 'services/atlas-refresh/**'
permissions:
  contents: write
concurrency:
  group: atlas-market-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Check updater
        run: node --test services/atlas-refresh/public-store.test.mjs
      - name: Refresh complete catalogs and observations
        run: node services/atlas-refresh/run-public.mjs
      - name: Commit complete public data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh source-dated Atlas market observations'
          git push origin HEAD:main
